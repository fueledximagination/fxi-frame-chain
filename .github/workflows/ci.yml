name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg (for the real last-frame extraction test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run lint
      - run: npm test
